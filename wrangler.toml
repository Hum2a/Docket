name = "jobtracker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "jobtracker.humza-butt.space", custom_domain = true }
]

# Built React SPA (npm run build:web → dist/)
# Non-API SPA routes: Worker notFound delegates to ASSETS (see src/index.ts).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "docket-documents"
preview_bucket_name = "docket-documents"

[triggers]
crons = ["0 8 * * *", "0 9 * * 1-5", "0 10 * * 1-5"]

# Secrets (set via wrangler secret put, not committed):
#   DATABASE_URL
#   API_KEY
#   RESEND_API_KEY (optional)
#   DIGEST_TO (optional)
#   DIGEST_FROM (optional)
#   OUTREACH_FROM / OUTREACH_REPLY_TO / OUTREACH_POSTAL_ADDRESS
#   RESEND_INBOUND_SECRET / UNSUBSCRIBE_SIGNING_KEY
